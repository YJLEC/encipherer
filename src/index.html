<body>
<div id="app" class="ec-root"></div>
<div id="ec-overlay-root"></div>
<noscript><div style="padding:40px;font-family:sans-serif;color:#c0392b">Encipherer 需要 JavaScript 支持,请更换浏览器。</div></noscript>
<script>
/* ===== 元信息 ===== */
window.__EC_BUILD__ = { version: '__VERSION__', time: '__BUILD_TIME__' };
</script>
<script>
/* ===== 浏览器环境垫片(必须先于内联依赖执行)=====
 * exceljs 的 UMD 浏览器包引用 process.nextTick / setImmediate;
 * 缺失时其内部异步队列永不排空(xlsx.load 挂起)。此处提供最小实现。 */
(function () {
  if (typeof window === 'undefined') return;
  var g = window;
  if (!g.setImmediate) {
    g.setImmediate = function (fn) { Promise.resolve().then(fn); };
    g.clearImmediate = function () {};
  }
  if (!g.process) {
    g.process = {
      browser: true, env: {},
      nextTick: function (fn) {
        var args = [].slice.call(arguments, 1);
        Promise.resolve().then(function () { fn.apply(null, args); });
      }
    };
  }
})();
</script>
<script>
/* @JS@ */
</script>
<script>
window.addEventListener('DOMContentLoaded', function () {
  try { Encipherer.ui.app.boot(); }
  catch (e) {
    console.error(e);
    document.getElementById('app').innerHTML =
      '<pre style="padding:24px;color:#c0392b;font-size:14px">应用启动失败:' + String(e && e.message || e) + '</pre>';
  }
});
</script>
